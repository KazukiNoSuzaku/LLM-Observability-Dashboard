[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-observability"
version = "1.0.0"
description = "Production-grade monitoring, safety, and analytics for LLM applications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "KazukiNoSuzaku"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.26.0",
    "httpx>=0.25.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "python-multipart>=0.0.6",
    "PyJWT>=2.8.0",
    "Authlib>=1.3.0",
    "itsdangerous>=2.1.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.29.0",
    "plotly>=5.18.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
]
postgres = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
]
openai = ["openai>=1.0.0"]
mistral = ["mistralai>=1.0.0"]
guardrails = [
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
]
all = [
    "llm-observability[dashboard,postgres,openai,mistral,guardrails]",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "anyio[trio]>=4.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
llm-obs-api = "llm_observability.cli:run_api"
llm-obs-dashboard = "llm_observability.cli:run_dashboard"
llm-obs-seed = "llm_observability.cli:run_seed"

[project.urls]
Homepage = "https://github.com/KazukiNoSuzaku/LLM-Observability-Dashboard"
Repository = "https://github.com/KazukiNoSuzaku/LLM-Observability-Dashboard"
Issues = "https://github.com/KazukiNoSuzaku/LLM-Observability-Dashboard/issues"

[tool.setuptools.packages.find]
include = ["llm_observability*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
