name: Release

on:
  push:
    tags:
      - "v*.*.*"   # trigger on version tags like v1.0.0, v2.1.3

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Run tests before releasing ─────────────────────────────────────────────
  test:
    name: Pre-release tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            fastapi>=0.104.0 uvicorn[standard]>=0.24.0 \
            sqlalchemy>=2.0.0 aiosqlite>=0.19.0 \
            pydantic>=2.5.0 pydantic-settings>=2.0.0 \
            anthropic>=0.26.0 httpx>=0.25.0 \
            opentelemetry-api>=1.20.0 opentelemetry-sdk>=1.20.0 \
            PyJWT>=2.8.0 Authlib>=1.3.0 itsdangerous>=2.1.0 \
            pytest>=7.4.0 pytest-asyncio>=0.23.0 anyio[trio]
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check llm_observability/ --select=E,F,W --ignore=E501
      - name: Run tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ANTHROPIC_API_KEY: "test-key"
          AUTH_ENABLED: "false"
          GUARDRAILS_ENABLED: "false"
          PHOENIX_ENABLED: "false"
          JUDGE_ENABLED: "false"
        run: pytest tests/ -v --tb=short --ignore=tests/test_guardrails.py

  # ── Build Python wheel + sdist ─────────────────────────────────────────────
  build-python:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build --outdir dist/
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  # ── Build standalone executables (PyInstaller) ─────────────────────────────
  build-executable:
    name: Build executable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: llm-obs-linux-amd64
            ext: ""
          - os: windows-latest
            artifact: llm-obs-windows-amd64
            ext: ".exe"
          - os: macos-latest
            artifact: llm-obs-macos-amd64
            ext: ""

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller \
            --name "${{ matrix.artifact }}" \
            --onefile \
            --noconfirm \
            --clean \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.lifespan.on \
            --hidden-import=aiosqlite \
            --hidden-import=sqlalchemy.dialects.sqlite \
            --hidden-import=pydantic_settings \
            --hidden-import=opentelemetry.sdk.trace \
            --hidden-import=opentelemetry.sdk.resources \
            --hidden-import=email._header_value_parser \
            --collect-submodules=llm_observability \
            --add-data="llm_observability/dashboard/app.py:llm_observability/dashboard" \
            --add-data="scripts/seed_data.py:scripts" \
            llm_observability/cli.py
        shell: bash

      - name: Verify executable
        run: |
          ./dist/${{ matrix.artifact }}${{ matrix.ext }} --help || echo "Built successfully (help flag may not be supported)"
        shell: bash
        continue-on-error: true

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}${{ matrix.ext }}

  # ── Build and push Docker image to GitHub Container Registry ──────────────
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Create GitHub Release with all assets ─────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test, build-python, build-executable, docker]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts into release dir
        run: |
          mkdir -p release
          # Python dist (wheel + sdist)
          cp release-assets/python-dist/* release/ 2>/dev/null || true
          # Executables
          cp release-assets/llm-obs-linux-amd64/* release/ 2>/dev/null || true
          cp release-assets/llm-obs-windows-amd64/* release/ 2>/dev/null || true
          cp release-assets/llm-obs-macos-amd64/* release/ 2>/dev/null || true
          ls -la release/

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges)
          else
            NOTES=$(git log --pretty=format:"- %s" --no-merges | head -20)
          fi
          echo "NOTES<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LLM Observability Dashboard ${{ github.ref_name }}"
          body: |
            ## What's Changed

            ${{ steps.notes.outputs.NOTES }}

            ## Installation

            ### Option 1 — pip install (recommended)
            ```bash
            pip install llm_observability-${{ steps.version.outputs.VERSION }}-py3-none-any.whl
            llm-obs-api          # start API server on :8000
            llm-obs-dashboard    # start Streamlit dashboard on :8501
            ```

            ### Option 2 — Standalone executables (no Python required)
            Download the binary for your OS from the assets below and run it directly.

            | Platform | File |
            |----------|------|
            | Linux x86_64 | `llm-obs-linux-amd64` |
            | Windows x86_64 | `llm-obs-windows-amd64.exe` |
            | macOS x86_64 | `llm-obs-macos-amd64` |

            ### Option 3 — Docker
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ```

            ## Quick Start

            See [QUICKSTART.md](https://github.com/${{ github.repository }}/blob/main/QUICKSTART.md) for full setup instructions.
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
